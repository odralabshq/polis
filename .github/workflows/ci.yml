name: CI

permissions: {}  # Explicit empty - each job declares its own

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SYSBOX_VERSION: "0.6.7"
  SYSBOX_SHA256: "b7ac389e5a19592cadf16e0ca30e40919516128f6e1b7f99e1cb4ff64554172e"
  POLIS_IMAGES: >-
    ghcr.io/odralabshq/polis-resolver-oss:latest
    ghcr.io/odralabshq/polis-gate-oss:latest
    ghcr.io/odralabshq/polis-certgen-oss:latest
    ghcr.io/odralabshq/polis-sentinel-oss:latest
    ghcr.io/odralabshq/polis-scanner-oss:latest
    ghcr.io/odralabshq/polis-workspace-oss:latest
    ghcr.io/odralabshq/polis-toolbox-oss:latest
    ghcr.io/odralabshq/polis-control-plane-oss:latest

jobs:
  # ── Stage 1a: Lint Rust ───────────────────────────────────────────
  lint-rust:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: |
          cargo fmt --all --manifest-path cli/Cargo.toml -- --check
          cargo fmt --all --manifest-path services/control-plane/Cargo.toml -- --check
          cargo fmt --all --manifest-path services/toolbox/Cargo.toml -- --check

      - name: Check CLI without dashboard feature
        run: cargo check --manifest-path cli/Cargo.toml --no-default-features

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --manifest-path cli/Cargo.toml -- -D warnings -A dead-code
          cargo clippy --workspace --all-targets --manifest-path services/control-plane/Cargo.toml -- -D warnings
          cargo clippy --workspace --all-targets --manifest-path services/toolbox/Cargo.toml -- -D warnings

  # ── Stage 1b: Lint C ──────────────────────────────────────────────
  lint-c:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: cppcheck
        run: |
          find services/sentinel/modules -name '*.c' -print0 | \
            xargs -0 cppcheck --enable=warning,performance --error-exitcode=1

  # ── Stage 1c: cargo-deny (licenses, advisories, bans, sources) ──
  cargo-deny:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        workspace:
          - cli
          - services/control-plane
          - services/toolbox
        checks:
          - advisories
          - bans licenses sources
      fail-fast: false
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          command: check ${{ matrix.checks }}
          manifest-path: ${{ matrix.workspace }}/Cargo.toml

  # ── Stage 1d: Lint Shell ──────────────────────────────────────────
  lint-shell:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck tools/dev-vm.sh tools/blocked.sh scripts/install.sh

  # ── Stage 2a: Test Rust ───────────────────────────────────────────
  test-rust:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Test CLI (skip proptests)
        run: cargo test --workspace --manifest-path cli/Cargo.toml -- --skip proptests

      - name: Test control-plane
        run: cargo test --workspace --manifest-path services/control-plane/Cargo.toml

      - name: Test Toolbox
        run: cargo test --workspace --manifest-path services/toolbox/Cargo.toml

      - name: Test polis-common
        run: cargo test --manifest-path lib/crates/polis-common/Cargo.toml

  # ── Stage 2b: Test Rust Proptests ─────────────────────────────────
  test-rust-proptests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Test CLI proptests
        run: cargo test --workspace --manifest-path cli/Cargo.toml -- proptests

  # ── Stage 2c: Test C ──────────────────────────────────────────────
  test-c:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compile and run C tests
        run: |
          for src in tests/native/sentinel/test_*.c; do
            bin="${src%.c}"
            gcc -Wall -Werror -o "$bin" "$src"
            "$bin"
          done

  # ── Stage 3a: Build containers ────────────────────────────────────
  build-containers:
    runs-on: ubuntu-24.04
    needs: [test-rust, test-c]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Login to DHI registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: |
            image=moby/buildkit:v0.19.0@sha256:14aa1b4dd92ea0a4cd03a54d0c6079046ea98cd0c0ae6176bdd7036ba370cbbe
            network=host

      - name: Build images (compose + buildx GHA cache)
        run: |
          touch .env
          docker buildx bake \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max' \
            --load \
            -f docker-compose.yml

      - name: Save and compress images
        run: |
          docker save ${{ env.POLIS_IMAGES }} | zstd -T0 -3 -o polis-images.tar.zst

      - name: Upload image artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: polis-images
          path: polis-images.tar.zst
          retention-days: 1
          compression-level: 0

  # ── Stage 3b: BATS unit tests ─────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-24.04
    needs: [test-rust, test-c]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Generate secrets for ACL structure tests
        run: |
          chmod +x ./services/state/scripts/generate-secrets.sh
          touch .env
          ./services/state/scripts/generate-secrets.sh ./secrets .

      - name: Run unit tests
        run: ./tests/run-tests.sh unit

  # ── Stage 3d: Container structure tests ─────────────────────────────────
  container-structure-tests:
    runs-on: ubuntu-24.04
    needs: build-containers
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Pull container-structure-test image
        run: docker pull ghcr.io/googlecontainertools/container-structure-test:1.22.1

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polis-images

      - name: Load images
        run: zstd -d polis-images.tar.zst -o polis-images.tar && docker load -i polis-images.tar

      - name: Run container structure tests
        run: |
          CST="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/tests:/tests ghcr.io/googlecontainertools/container-structure-test:1.22.1 test"
          $CST --image ghcr.io/odralabshq/polis-certgen-oss:latest --config /tests/container-structure/certgen.yaml
          $CST --image ghcr.io/odralabshq/polis-gate-oss:latest --config /tests/container-structure/gate.yaml
          $CST --image ghcr.io/odralabshq/polis-resolver-oss:latest --config /tests/container-structure/resolver.yaml
          $CST --image ghcr.io/odralabshq/polis-scanner-oss:latest --config /tests/container-structure/scanner.yaml
          $CST --image ghcr.io/odralabshq/polis-sentinel-oss:latest --config /tests/container-structure/sentinel.yaml
          $CST --image ghcr.io/odralabshq/polis-toolbox-oss:latest --config /tests/container-structure/toolbox.yaml
          $CST --image ghcr.io/odralabshq/polis-control-plane-oss:latest --config /tests/container-structure/control-plane.yaml
          $CST --image ghcr.io/odralabshq/polis-workspace-oss:latest --config /tests/container-structure/workspace.yaml

  # ── Stage 3c: Scan images (Trivy) ─────────────────────────────────
  scan-images:
    runs-on: ubuntu-24.04
    needs: build-containers
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        image:
          - polis-gate-oss
          - polis-sentinel-oss
          - polis-workspace-oss
          - polis-scanner-oss
          - polis-resolver-oss
          - polis-toolbox-oss
          - polis-control-plane-oss
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polis-images

      - name: Load images
        run: zstd -d polis-images.tar.zst -o polis-images.tar && docker load -i polis-images.tar

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6 (only clean tag)
        with:
          version: v0.69.3
          cache: true

      - name: Scan ${{ matrix.image }} with Trivy
        run: |
          trivy image \
            --format sarif \
            --output 'trivy-${{ matrix.image }}.sarif' \
            --severity 'HIGH,CRITICAL' \
            --ignore-unfixed \
            'ghcr.io/odralabshq/${{ matrix.image }}:latest'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'
          category: 'trivy-${{ matrix.image }}'
        if: always()
        continue-on-error: true

  # ── Stage 4: Integration tests ────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-24.04
    needs: [build-containers, unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Login to DHI registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install sysbox
        run: source ./scripts/ci-helpers.sh && install_sysbox

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polis-images

      - name: Load images
        run: zstd -d polis-images.tar.zst -o polis-images.tar && docker load -i polis-images.tar

      - name: Install just
        run: curl --proto '=https' -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Setup certificates and secrets
        run: source ./scripts/ci-helpers.sh && setup_certs_and_secrets

      - name: Start containers
        run: just up

      - name: Wait for healthy
        run: source ./scripts/ci-helpers.sh && wait_for_healthy

      - name: Run integration tests
        run: ./tests/run-tests.sh --ci integration

      - name: Show logs on failure
        if: failure()
        run: source ./scripts/ci-helpers.sh && show_logs_on_failure

  # ── Stage 5: E2E tests ─────────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-24.04
    needs: integration-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Login to DHI registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install sysbox
        run: source ./scripts/ci-helpers.sh && install_sysbox

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: polis-images

      - name: Load images
        run: zstd -d polis-images.tar.zst -o polis-images.tar && docker load -i polis-images.tar

      - name: Install just
        run: curl --proto '=https' -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Setup certificates and secrets
        run: source ./scripts/ci-helpers.sh && setup_certs_and_secrets

      - name: Start containers
        run: |
          just up
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d httpbin

      - name: Wait for healthy
        run: source ./scripts/ci-helpers.sh && wait_for_healthy 90

      - name: Wait for httpbin
        run: |
          for i in $(seq 1 30); do
            if docker exec polis-gate nc -z 10.20.1.100 8080 2>/dev/null; then
              echo "httpbin reachable"
              exit 0
            fi
            echo "Waiting for httpbin... ($i/30)"
            sleep 2
          done
          echo "httpbin not reachable after 60s"
          docker ps -a --filter name=httpbin
          exit 1

      - name: Verify containers and warm up ICAP chain
        run: |
          echo "=== Container status ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo ""
          echo "=== Warming up ICAP chain ==="
          for i in 1 2 3 4 5; do
            if docker exec polis-workspace curl -sf -o /dev/null --connect-timeout 5 \
                --proxy "http://10.10.1.10:8080" "http://10.20.1.100:8080/get" 2>/dev/null; then
              echo "ICAP chain warm (attempt $i)"
              break
            fi
            echo "ICAP warmup attempt $i failed, retrying..."
            sleep 3
          done

      - name: Run E2E tests
        run: |
          mkdir -p /tmp/test-results
          ./tests/run-tests.sh --ci e2e 2>&1 | tee /tmp/test-results/e2e-output.log
        timeout-minutes: 15

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-results
          path: /tmp/test-results/
          retention-days: 3

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== E2E Test Output ==="
          cat /tmp/test-results/e2e-output.log 2>/dev/null || echo "No test output captured"
          echo ""
          source ./scripts/ci-helpers.sh && show_logs_on_failure
          echo "=== polis-httpbin ==="
          docker logs polis-httpbin 2>&1 | tail -20 || true
          echo "=== docker network inspect ==="
          docker network inspect polis_external-bridge 2>/dev/null | head -40 || true
          echo "=== Container health details ==="
          for c in polis-gate polis-sentinel polis-state polis-toolbox polis-control-plane polis-workspace; do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c" 2>/dev/null || echo "missing")
            state=$(docker inspect --format '{{.State.Status}}' "$c" 2>/dev/null || echo "missing")
            echo "$c: state=$state health=$health"
          done

  # ── Security: Semgrep SAST ─────────────────────────────────────────
  security-semgrep:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    container:
      image: semgrep/semgrep:1.152.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Semgrep scan
        run: semgrep scan --config auto --sarif -o semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast
        if: always()

  # ── Security: Checkov IaC ──────────────────────────────────────────
  security-checkov:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@2fd3901c8feb52417f27f0d9800259a106c1ec1e # v12.3089.0
        with:
          directory: .
          framework: dockerfile github_actions yaml
          output_format: sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: results.sarif
          category: checkov-iac
        if: always()

  # ── Security: OSV Scanner (Rust/C dependency CVEs) ───────────────
  security-osv:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a30b4c310bacb7c0635e316e0720e23f0b791cf8 # v2.3.3
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  # ── Security: SonarCloud ──────────────────────────────────────────
  security-sonarcloud:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key NOSONAR
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=odralabshq_polis
            -Dsonar.organization=odralabshq
            -Dsonar.qualitygate.wait=true
